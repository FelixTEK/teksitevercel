          <!--Signup Form-->
          <main class="form-signin d-flex justify-content-between align-items-center py-3 my-5 w-100 m-auto">
            <form>
              <h1 class="h3 mb-3 fw-normal">Sign up</h1>
          
              <div class="form-floating my-2">
                <input type="text" class="form-control" id="uname" placeholder="Username" required>
                <label for="floatingInput">Username</label>
                <div class="invalid-feedback">
                  Please choose a username.
                </div>

              </div>

              <div class="form-floating my-2">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="floatingInput">Email Address</label>
              </div>

              <div class="form-floating my-2">
                <input type="password" class="form-control" id="pwd" placeholder="Password" required>
                <label for="floatingInput">Password</label>
              </div>

              <div class="form-floating my-2">
                <input type="password" class="form-control" id="confpwd" placeholder="ConfirmPassword" required>
                <label for="floatingInput">Confirm Password</label>
              </div>
          
              <button class="btn btn-primary w-100 py-2" type="submit">Sign up</button>
              <p class="mt-5 mb-3 text-body-secondary">Already have an account? <a href="login.html">Click here</a> to sign in.</p>
            </form>
          </main>
          <!--Signup Form-->
